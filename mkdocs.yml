site_name: RVCBench Docs
site_url: https://nanboy-ronan.github.io/RVCBench/docs/
site_description: Comprehensive voice cloning evaluation — automatic metrics and ready-to-use benchmark datasets.
repo_url: https://github.com/Nanboy-Ronan/RVCBench
repo_name: RVCBench
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site/docs
strict: true

theme:
  name: material
  custom_dir: docs/theme
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

hooks:
  - scripts/docs_hooks.py
extra_css:
  - stylesheets/docs.css

exclude_docs: |
  /index.html
  /site-src/
  /theme/
  /audits/
  /validated_runs/
  /robots.txt
  /sitemap.xml
  /llms.txt
  /discoverability.md
  /model_sizes.md

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn

nav:
  - Overview: README.md
  - Get started:
      - Quickstart: getting-started/quickstart.md
      - Installation & upgrades: getting-started/installation.md
  - Evaluate:
      - Score your own audio: evaluation/metrics.md
      - Evaluate your model: evaluation/adding_a_model.md
      - Benchmark suites: evaluation/core_suite.md
      - Datasets: evaluation/datasets.md
      - Evaluation FAQ: evaluation/faq.md
  - Reference:
      - Python API: reference/api.md
      - Command line: reference/cli.md
      - Runs, reports & resume: reference/run_protocol.md
  - Built-in models:
      - Supported models: integrations/models.md
      - Model environments: integrations/model_environments.md
      - Model setup: integrations/quickstart_model_setup.md
      - Validation coverage: integrations/validation.md
  - Project:
      - Paper results: reproduction/paper_results.md
      - Versions & paper reproduction: reproduction/versions.md
      - Homepage: https://nanboy-ronan.github.io/RVCBench/
      - Changelog: https://github.com/Nanboy-Ronan/RVCBench/blob/main/CHANGELOG.md
      - Contributing: https://github.com/Nanboy-Ronan/RVCBench/blob/main/CONTRIBUTING.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nanboy-Ronan/RVCBench
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/rvcbench/
