# ZONOS2 (Zyphra/ZONOS2) is not pip-installable as a package; it's a
# `uv`-managed project (git clone + `uv sync`), which creates its own
# `.venv` with its own resolved deps (torch==2.9.1, sgl_kernel, flashinfer,
# nvidia-cutlass-dsl, etc — all cu12x-tagged, so they run fine on drivers
# that only support CUDA 12.x, unlike sglang-omni which needs CUDA 13).
#
# `uv sync`'s default python-version resolution can pick Python 3.12, which
# has no prebuilt `monotonic-align` wheel (the repo's src/models/__init__.py
# unconditionally imports bertvits2_model, which needs it) and fails to
# build from source under 3.12's C-API changes. Force 3.11 instead.
#
# There is no `pip` binary inside a uv-managed venv; use `uv pip install
# --python <venv>/bin/python ...`.
#
# Setup:
#   1. git clone https://github.com/Zyphra/ZONOS2.git checkpoints/ZONOS2-repo
#   2. cd checkpoints/ZONOS2-repo && uv sync --python 3.11
#   3. uv pip install --python .venv/bin/python "setuptools<81"
#   4. uv pip install --python .venv/bin/python --no-build-isolation-package openai_whisper \
#        hydra-core==1.3.2 hydra-colorlog==0.1.4 omegaconf==2.3.0 jiwer==3.0.3 \
#        librosa matplotlib openai_whisper==20231117 pymcd==0.2.1 pysndfx==0.3.6 \
#        speechbrain==1.0.2 torch_stoi==0.2.1 tqdm==4.64.1 pandas GPUtil psutil \
#        onnxruntime
#      (openai-whisper's sdist needs pkg_resources at build time, which uv's
#      isolated build env doesn't have by default; --no-build-isolation-package
#      builds it against the target venv instead, which does.)
#   5. uv pip install --python .venv/bin/python monotonic-align
#   6. uv pip install --python .venv/bin/python torch==2.9.1 torchaudio==2.9.1
#      (LAST: step 4 drags torch back to an older, mismatched pair; ZONOS2
#      hard-pins torchaudio==2.9.1 in its own pyproject.toml.)
#   7. uv pip install --python .venv/bin/python "speechbrain>=1.0.3"
#      (speechbrain 1.0.2 calls torchaudio.list_audio_backends(), which was
#      removed in torchaudio 2.9; 1.1.0 does not call it.)
#
# GPU placement: TTSLLM's scheduler communicates over ZMQ IPC and has no
# `device`/`gpu_id` argument, so `device: cuda:N` in the benchmark config is
# NOT honoured by this model — set CUDA_VISIBLE_DEVICES on the process
# instead. It also pre-allocates a large KV cache (~55GB on an 80GB A100),
# so run it alone on its GPU.
#
# Run with: checkpoints/ZONOS2-repo/.venv/bin/python run_vc.py --config-name ...
name: zonos2
note: "not a conda env — see the setup steps above; uv manages checkpoints/ZONOS2-repo/.venv"
