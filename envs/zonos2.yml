# ZONOS2 uses an upstream uv environment rather than a conda environment.
# Locally validated source revision: 194c0a3ab67b90383a67646289f28d4ecb1c1f64.
# The fixed subset uses Python 3.11, torch/torchaudio 2.9.1, NumPy 2.4.1,
# Transformers 4.57.3, sgl-kernel 0.3.20 and flashinfer-python 0.5.3.
# Existing environment validation is not a clean-install or driver compatibility guarantee.
#
# In a new checkout:
#   git clone https://github.com/Zyphra/ZONOS2.git checkpoints/ZONOS2-repo
#   cd checkpoints/ZONOS2-repo
#   git checkout 194c0a3ab67b90383a67646289f28d4ecb1c1f64
#   uv sync --python 3.11 --frozen
#   uv pip install --python .venv/bin/python hydra-core==1.3.2 hydra-colorlog==0.1.4
#   uv pip install --python .venv/bin/python pandas==3.0.5 soundfile==0.13.1
#
# Generate using this interpreter from the RVCBench root. Set CUDA_VISIBLE_DEVICES
# before starting the process and request logical cuda:0; other devices are rejected.
# Keep inference in a dedicated process, without an existing process group or DAC cache.
# Configure code_path, checkpoint, vocoder_path and speaker_file_path as explicit
# local paths to capture source and weight hashes. memory_ratio and max_running_req
# control resource allocation. distributed_port chooses a loopback rendezvous port.
# Use a separate evaluation environment for MCD/WER/SIM; generation needs none of those.
name: zonos2
note: "upstream uv environment; see setup comments above"
