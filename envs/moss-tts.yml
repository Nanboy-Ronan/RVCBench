# Validated generation runtime for the local MOSS-TTS v1.5 and codec snapshots.
# Existing environment validation; a clean installation has not yet been tested.
# Run scorers separately in the eval environment (NumPy 1.26.4 / Torch 2.6).
name: moss-tts
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - libsndfile
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - -e ..
      - torch==2.8.0
      - torchaudio==2.8.0
      - transformers==5.14.1
      - tokenizers==0.22.2
      - numpy==2.4.6
      - accelerate==1.14.0
