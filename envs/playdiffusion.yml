# Key pins validated in the existing local runtime; clean installation unverified.
# The upstream checkout must supply its model-specific inference dependencies.
name: playdiffusion
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - libsndfile
  - espeak-ng
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - -e ..
      - torch==2.6.0
      - torchaudio==2.6.0
      - transformers==4.57.3
      - tokenizers==0.22.1
      - numpy==1.24.3
      - fairseq2==0.4.4
      - nltk==3.9.1
