# Existing generation runtime validated; clean installation remains unverified.
# Core CLI plus dots.tts, with scoring performed in a separate eval environment.
name: dots-tts
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ffmpeg
  - libsndfile
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - -e ..
      - dots.tts==0.2.1
      - torch==2.8.0
      - torchaudio==2.8.0
      - transformers==5.14.1
      - tokenizers==0.22.2
      - numpy==2.4.6
      - librosa==0.11.0
