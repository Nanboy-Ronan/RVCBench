name: Public checkout checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,http]'
      - run: python -m pip install ruff && ruff check .
      - run: rvcbench doctor
      - run: python -m pytest -q
      - run: python scripts/validate_quickstarts.py
      - run: rvcbench smoke --output results/ci-smoke
      - run: python docs/site-src/build.py
      - run: git diff --exit-code -- docs/index.html docs/llms.txt
      - name: Build the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Run from the installed wheel outside the checkout
        run: |
          python -m pip uninstall -y rvcbench
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import rvcbench; assert 'site-packages' in rvcbench.__file__, rvcbench.__file__"
          rvcbench doctor
          rvcbench smoke --output wheel-smoke
          rvcbench run --config-name ots_vc/clean/libritts/qwen3_tts_ots --cfg job
          python -c "from rvcbench.benchmark.submission import load_suite, read_json; s = load_suite('full-v1'); t = s['tasks'][0]; assert read_json(s['_directory'] / t['selection'])['samples']"
