name: Public checkout checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,http]'
      - run: rvcbench doctor
      - run: python -m pytest -q
      - run: python scripts/validate_quickstarts.py
      - run: rvcbench smoke --output results/ci-smoke
      - run: python docs/site-src/build.py
      - run: git diff --exit-code -- docs/index.html docs/llms.txt
