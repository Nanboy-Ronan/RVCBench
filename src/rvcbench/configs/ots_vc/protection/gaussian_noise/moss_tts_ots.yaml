# @package _global_

run_name: moss_tts_ots_on_libritts_with_gaussian_noise
device: cuda:0
base_dir: .
protected_audio_dir: null
protection_run_name: grnoise_on_libritts
protected_audio_subdir: protected_audio
vc:
  mode: ots
  model: moss_tts
output_paths:
  metrics_file: results/moss_tts_ots_on_libritts_with_gaussian_noise/metrics.json
batch_size: 16 # not used in VC
adversary:
  checkpoint: checkpoints/MOSS-TTS-v1.5
  attn_implementation: sdpa
  max_new_tokens: 4096
  language: null
  max_samples: null
defaults:
  - _self_
  - /dataset: libritts
evaluation:
  bootstrap:
    enabled: true
    num_samples: 1000
    confidence_level: 0.95
    seed: null
