# @package _global_

run_name: "zonos2_ots_on_aishell"
device: "cuda:0"
base_dir: "."

vc:
  mode: "ots"
  model: "zonos2"

output_paths:
  metrics_file: "results/zonos2_ots_on_aishell/metrics.json"

adversary:
  checkpoint: "Zyphra/ZONOS2"
  seed: 42
  clean_speaker_background: false
  accurate_mode: true
  max_tokens: null
  max_samples: null

batch_size: 16 # not used in VC

defaults:
  - _self_
  - /dataset: aishell
evaluation:
  bootstrap:
    enabled: true
    num_samples: 1000
    confidence_level: 0.95
    seed: null
