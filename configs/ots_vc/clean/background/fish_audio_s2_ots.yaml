# @package _global_

run_name: "fish_audio_s2_ots_on_background_noise"
device: "cpu"
base_dir: "."

vc:
  mode: "ots"
  model: "fish_audio_s2"

output_paths:
  metrics_file: "results/fish_audio_s2_ots_on_background_noise/metrics.json"

adversary:
  name: "FishAudioS2"
  endpoint_url: "http://localhost:8001/v1/tts"
  response_format: "wav"
  timeout: 600
  request_attempts: 3
  retry_delay_sec: 10
  max_new_tokens: 2048
  chunk_length: 300
  top_p: 0.8
  repetition_penalty: 1.1
  temperature: 0.8
  normalize: true
  use_memory_cache: "off"
  default_reference_text: "Here is a sample exhibiting the desired voice characteristics."
  max_samples: null

batch_size: 16

defaults:
  - _self_
  - /dataset: background_noise
evaluation:
  device: "cuda:0"
  resume: true
  progress_log_interval: 10
  cpu_threads: 8
  interop_threads: 1
  bootstrap:
    enabled: true
    num_samples: 1000
    confidence_level: 0.95
    seed: null
