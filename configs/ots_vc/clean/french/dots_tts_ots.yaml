# @package _global_

run_name: "dots_tts_ots_on_french"
device: "cuda:0"
base_dir: "."

vc:
  mode: "ots"
  model: "dots_tts"

output_paths:
  metrics_file: "results/dots_tts_ots_on_french/metrics.json"

adversary:
  checkpoint: "checkpoints/dots.tts-soar"
  precision: "bfloat16"
  optimize: true
  num_steps: 10
  guidance_scale: 1.2
  max_samples: null

batch_size: 16 # not used in VC

defaults:
  - _self_
  - /dataset: french
evaluation:
  bootstrap:
    enabled: true
    num_samples: 1000
    confidence_level: 0.95
    seed: null
