# @package _global_

run_name: "zonos2_ots_on_libritts"
device: "cuda:0"
base_dir: "."

vc:
  mode: "ots"
  model: "zonos2"

output_paths:
  metrics_file: "results/zonos2_ots_on_libritts/metrics.json"

adversary:
  checkpoint: "Zyphra/ZONOS2"
  code_path: null
  memory_ratio: 0.9
  max_running_req: 256
  distributed_port: null
  vocoder_path: null
  speaker_file_path: null
  seed: 42
  clean_speaker_background: false
  accurate_mode: true
  max_tokens: null
  max_samples: null

batch_size: 16 # not used in VC

defaults:
  - _self_
  - /dataset: libritts
evaluation:
  bootstrap:
    enabled: true
    num_samples: 1000
    confidence_level: 0.95
    seed: null
