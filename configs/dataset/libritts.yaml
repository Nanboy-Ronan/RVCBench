# Dataset Configuration

name: "LibriTTS"
root_path: "./data/Libritts"
use_hf_dataset: true
hf_dataset_id: "Nanboy/RVCBench"
hf_config_name: "Libritts"
hf_cache_dir: null
speaker_id: null #  null for all speaker
manifest_variant: speaker # Historical evaluation; speaker_text remains an explicit alternate.
max_wav_value: 32768.0
sampling_rate: 24000
filter_length: 2048
hop_length: 512
win_length: 2048
n_mel_channels: 128
mel_fmin: 0.0
mel_fmax: null
add_blank: true
n_speakers: 40
cleaned_text: true
text_feature_policy: strict_cached # Training features; zero-shot loading does not require them.
# voice cloning defaults
return_path: true
