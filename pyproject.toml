[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rvcbench"
version = "2.0.0.dev0"
description = "Voice cloning robustness benchmark with auditable sample-level runs"
readme = "README.md"
requires-python = ">=3.10"
license = "CC0-1.0"
license-files = ["LICENSE", "src/rvcbench/protection/safespeech/original_code/LICENSE"]
authors = [
  { name = "Ruinan Jin", email = "ruinanjin@alumni.ubc.ca" },
  { name = "Xinting Liao" },
  { name = "Hanlin Yu" },
  { name = "Deval Pandya" },
  { name = "Xiaoxiao Li" },
]
keywords = [
  "voice cloning", "text-to-speech", "speaker privacy", "audio protection",
  "adversarial audio", "audio deepfake robustness", "benchmark", "speaker verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4", "numpy>=1.24,<3",
  "pandas>=2,<3", "pyarrow>=14", "soundfile>=0.12", "huggingface_hub>=0.25,<2",
  "torch>=2.3", "tqdm>=4.64", "packaging>=23"
]

[project.optional-dependencies]
http = ["requests>=2.31,<3", "ormsgpack>=1.7,<2"]
enkidu = ["numpy==1.26.4", "torch==2.6.0", "torchaudio==2.6.0", "speechbrain==1.0.3"]
qwen3 = ["numpy==1.26.4", "qwen-tts==0.1.1", "torch==2.6.0", "torchaudio==2.6.0"]
eval = [
  "numpy==1.26.4", "numba>=0.59,<0.62", "torch==2.6.0", "torchaudio==2.6.0", "jiwer==3.0.3", "librosa>=0.10,<0.12", "openai-whisper",
  "pymcd==0.2.1", "pysptk>=1.0", "speechbrain>=1.0.3,<2", "torch-stoi>=0.2", "scipy",
  "matplotlib", "jieba", "onnxruntime", "requests", "transformers>=4.40,<5"
]
test = ["pytest>=8", "jiwer==3.0.3", "json5>=0.9", "tomli>=2; python_version < '3.11'"]
dev = ["rvcbench[test]", "ruff>=0.6", "pre-commit>=3.5", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://nanboy-ronan.github.io/RVCBench/"
Repository = "https://github.com/Nanboy-Ronan/RVCBench"
Issues = "https://github.com/Nanboy-Ronan/RVCBench/issues"
Paper = "https://arxiv.org/abs/2602.00443"
Dataset = "https://huggingface.co/datasets/Nanboy/RVCBench"

[project.scripts]
rvcbench = "rvcbench.benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvcbench = [
  "configs/**/*.yaml",
  "configs/**/*.md",
  "benchmark/model_catalog.json",
  "suites/*/*.json",
  "datasets/*.csv",
  "models/bert/*.json",
  "models/text/*.rep",
  "models/text/*.pickle",
  "models/text/*.txt",
  "protection/safespeech/original_code/LICENSE",
  "protection/safespeech/original_code/README.md",
  "protection/safespeech/original_code/requirements.txt",
  "protection/safespeech/original_code/*.ipynb",
  "protection/safespeech/original_code/**/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/rvcbench/protection/safespeech/original_code", "checkpoints", "data", "results", "outputs"]

[tool.ruff.lint]
# Baseline: syntax errors, undefined names and other definite mistakes.
# Style rules are not enforced yet; widen this set as legacy modules are cleaned up.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Undefined names in legacy code paths that are not exercised by the benchmark runner.
# Each entry is a known defect: fix the module, then remove its line.
"src/rvcbench/adversary/bertvits2_finetune.py" = ["F821"]
"src/rvcbench/models/text/japanese.py" = ["F821"]
"src/rvcbench/protection/attackvc.py" = ["F821"]
