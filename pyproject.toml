[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvcbench"
version = "0.2.0"
description = "Voice cloning robustness benchmark with auditable sample-level runs"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<1.4", "omegaconf>=2.3,<2.4", "numpy>=1.24,<3",
  "pandas>=2,<3", "pyarrow>=14", "soundfile>=0.12", "huggingface_hub>=0.25,<2",
  "torch>=2.3", "tqdm>=4.64", "packaging>=23"
]

[project.optional-dependencies]
http = ["requests>=2.31,<3", "ormsgpack>=1.7,<2"]
enkidu = ["numpy==1.26.4", "torch==2.6.0", "torchaudio==2.6.0", "speechbrain==1.0.3"]
qwen3 = ["numpy==1.26.4", "qwen-tts==0.1.1", "torch==2.6.0", "torchaudio==2.6.0"]
eval = [
  "numpy==1.26.4", "numba>=0.59,<0.62", "torch==2.6.0", "torchaudio==2.6.0", "jiwer==3.0.3", "librosa>=0.10,<0.12", "openai-whisper",
  "pymcd==0.2.1", "speechbrain>=1.0,<2", "torch-stoi>=0.2", "scipy",
  "matplotlib", "jieba", "onnxruntime", "requests"
]
test = ["pytest>=8", "jiwer==3.0.3", "json5>=0.9"]

[project.scripts]
rvcbench = "src.benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"src.benchmark" = ["model_catalog.json"]
